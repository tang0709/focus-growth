function timerDayRanges(startMs,endMs){
 if(!Number.isFinite(startMs)||!Number.isFinite(endMs)||startMs>=endMs||endMs-startMs>31*86400000)return [];

  const d=new Date(cursor),date=dateKey(d),start=d.getHours()*60+d.getMinutes(),midnight=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(),until=Math.min(finish,midnight);

function recordTimerInterval(base,id,startMs,endMs,state='unknown',source='task-timer'){

  const occupied=base.activity.filter(a=>a.date===date&&a.taskId&&a.taskId!==id&&activityStart(a)<end&&activityEnd(a)>start).sort((a,b)=>activityStart(a)-activityStart(b));
  let cursor=start;const free=[];
  for(const a of occupied){const l=Math.max(start,activityStart(a)),r=Math.min(end,activityEnd(a));if(l>cursor)free.push([cursor,l]);conflicts+=Math.max(0,r-Math.max(cursor,l));cursor=Math.max(cursor,r)}

   if(source==='task-timer'){
    const evidence=base.activity.filter(a=>a.date===date&&evidenceSources.has(a.source)&&(a.taskId===null||a.taskId===id)&&activityEnd(a)>l&&activityStart(a)<r);

     const lo=Math.max(l,activityStart(a)),hi=Math.min(r,activityEnd(a));

}

function fillCompletionActivity(base,id,date,start,end,source='completion-auto',state='unknown'){
 if(!Number.isInteger(start)||!Number.isInteger(end)||start<0||end>1440||start>=end)return false;
 if(base.activity.some(a=>a.date===date&&a.taskId&&a.taskId!==id&&activityStart(a)<end&&activityEnd(a)>start))return false;
 const rows=[];
 for(const a of base.activity){
  if(a.date!==date||a.taskId||activityStart(a)>=end||activityEnd(a)<=start){rows.push(a);continue}
  const l=activityStart(a),r=activityEnd(a),lo=Math.max(l,start),hi=Math.min(r,end);

  const slot=Math.floor(i/10),j=Math.min(end,(slot+1)*10),intervals=rows.filter(a=>a.date===date&&activityStart(a)<j&&activityEnd(a)>i).sort((a,b)=>activityStart(a)-activityStart(b));

  for(const a of intervals){const left=Math.max(i,activityStart(a)),right=Math.min(j,activityEnd(a));if(left>cursor)rows.push({date,slot,startMinute:cursor,endMinute:left,state,taskId:id,source});cursor=Math.max(cursor,right)}

function assignPlanToExistingActualDraft(base,planId,date,start,end,clock){
 const plan=base.plans.find(p=>p.id===planId),task=plan&&base.tasks.find(t=>t.id===plan.taskId);
 if(!plan||!task||plan.date!==date||!Number.isInteger(start)||!Number.isInteger(end)||start<0||end>1440||start>=end)return {error:'计划或目标记录无效'};
 if(date>dateKey(clock)||date===dateKey(clock)&&end>clock.getHours()*60+clock.getMinutes())return {error:'未来时段不能标记完成'};
 if(base.history.some(h=>h.type==='plan-drag-actual'&&h.planId===planId))return {error:'该计划已登记，请调整现有记录'};
 const rows=base.activity.filter(a=>a.date===date&&activityStart(a)<end&&activityEnd(a)>start).sort((a,b)=>activityStart(a)-activityStart(b));
 if(!rows.length||rows.some(a=>activityStart(a)<start||activityEnd(a)>end))return {error:'目标时段变化'};
 if(rows.some(a=>a.taskId&&a.taskId!==task.id))return {error:'目标已关联其他任务，禁止覆盖'};
 const state=rows[0].state||'unknown';
 if(rows.some(a=>(a.state||'unknown')!==state))return {error:'状态不同，请选择单一状态块'};
 let pos=start;for(const a of rows){if(activityStart(a)!==pos)return {error:'目标工作块不连续'};pos=activityEnd(a)}
 if(pos!==end)return {error:'目标工作块不完整'};
 const next=clone(base);let assigned=0;
 for(const a of next.activity)if(a.date===date&&activityStart(a)>=start&&activityEnd(a)<=end&&!a.taskId){a.taskId=task.id;a.assignedFromPlanId=planId;assigned+=activityMinutes(a)}
 next.history.push({type:'plan-drag-actual',mode:'existing-activity',planId,taskId:task.id,date,start,duration:end-start,state,assignedMinutes:assigned,time:clock.toISOString()});
 const t=next.tasks.find(t=>t.id===task.id),plans=next.plans.filter(p=>p.taskId===task.id);
 const allDone=plans.length>0&&plans.every(p=>next.history.some(h=>h.type==='plan-drag-actual'&&h.planId===p.id)||activityCoversPlan(next,p));
 let completed=false;
 if(allDone&&!next.tasks.some(c=>c.parentId===t.id&&!c.done)&&next.taskTimer?.taskId!==t.id&&!t.done){t.done=true;t.completedAt=clock.toISOString();completed=true;if(next.currentTask===t.id)next.currentTask=null}
 const total=sumActivity(next.activity.filter(a=>a.taskId===t.id));if(total>0)t.actual=Math.max(Number.isFinite(t.actual)?t.actual:0,total);
 return {next,addedMinutes:0,assignedMinutes:assigned,actualMinutes:end-start,completed,state};
}

function editActualIntervalDraft(base,date,start,end,nextStart,nextEnd,clock,changeTaskId,changeState){
 if(![start,end,nextStart,nextEnd].every(Number.isInteger)||start<0||end>1440||start>=end||nextStart<0||nextEnd>1440||nextStart>=nextEnd)return {error:'起止时间无效'};
 if(date>dateKey(clock)||(date===dateKey(clock)&&nextEnd>clock.getHours()*60+clock.getMinutes()))return {error:'实际工作时段不能延伸到未来'};
 const rows=base.activity.filter(a=>a.date===date&&activityStart(a)>=start&&activityEnd(a)<=end).sort((a,b)=>activityStart(a)-activityStart(b));
 if(!rows.length||activityStart(rows[0])!==start||activityEnd(rows[rows.length-1])!==end)return {error:'原始记录已变化，请刷新后重试'};
 let pos=start;for(const a of rows){if(activityStart(a)!==pos)return {error:'工作块不连续'};pos=activityEnd(a)}
 if(changeTaskId!==undefined&&changeTaskId!==null&&!base.tasks.some(t=>t.id===changeTaskId))return {error:'任务不存在'};

 const outside=base.activity.filter(a=>a.date!==date||activityEnd(a)<=start||activityStart(a)>=end);
 if(outside.some(a=>a.date===date&&activityStart(a)<nextEnd&&activityEnd(a)>nextStart))return {error:'目标时段已有其他实际记录，未修改'};
 const next=clone(base),keys=new Set(rows.map(a=>a.date+':'+activityStart(a)+':'+activityEnd(a)));

 const taskId=changeTaskId===undefined?(rows[0].taskId||null):(changeTaskId||null);
 const state=changeState===undefined?(rows[0].state||'unknown'):changeState;
 const originalSource=rows[0].originalSource||rows[0].source;
 const planId=rows[0].assignedFromPlanId||rows[0].planId||null;
 const modified=nextStart!==start||nextEnd!==end;
 for(let m=nextStart;m<nextEnd;){
  const hi=Math.min(nextEnd,(Math.floor(m/10)+1)*10);
  const row={...rows[0],date,slot:Math.floor(m/10),startMinute:m,endMinute:hi,taskId,state};
  if(modified){row.source='manual-adjustment';row.originalSource=originalSource;row.manuallyAdjusted=true}
  if(planId)row.assignedFromPlanId=planId;
  next.activity.push(row);m=hi;
 }
 next.history.push({type:'actual-interval-adjusted',date,before:{start,end,taskId:rows[0].taskId||null,state:rows[0].state||'unknown'},after:{start:nextStart,end:nextEnd,taskId,state},time:clock.toISOString()});
 const affected=new Set([...rows.map(a=>a.taskId).filter(Boolean),taskId].filter(Boolean));
 for(const id of affected){
  const t=next.tasks.find(t=>t.id===id);if(!t)continue;
  const before=sumActivity(base.activity.filter(a=>a.taskId===id)),after=sumActivity(next.activity.filter(a=>a.taskId===id)),previous=Number.isFinite(t.actual)?t.actual:0;

}
function actualPlanDropDraft(base,planId,date,start,now){

 if(!p||!t||p.date!==date||!Number.isInteger(start)||start<0||start+p.duration>1440||!Number.isFinite(now?.getTime?.()))return {error:'排程或日期无效'};
 if(date>dateKey(now)||date===dateKey(now)&&start+p.duration>now.getHours()*60+now.getMinutes())return {error:'未来或未结束的时间不能登记实际工作'};
 if(base.history.some(h=>h.type==='plan-drag-actual'&&h.planId===planId))return {error:'该计划已手动登记过实际工作'};
 const end=start+p.duration,existing=base.activity.filter(a=>a.date===date&&activityStart(a)<end&&activityEnd(a)>start).sort((a,b)=>activityStart(a)-activityStart(b));

 const next=clone(base),added=[];let cursor=start;
 function missing(lo,hi){for(let m=lo;m<hi;){const right=Math.min(hi,(Math.floor(m/10)+1)*10);added.push({date,slot:Math.floor(m/10),startMinute:m,endMinute:right,taskId:t.id,state:'unknown',source:'plan-drag-manual',planId});m=right}}
 for(const a of existing){const lo=Math.max(start,activityStart(a)),hi=Math.min(end,activityEnd(a));if(lo>cursor)missing(cursor,lo);cursor=Math.max(cursor,hi)}
 if(cursor<end)missing(cursor,end);
 next.activity.push(...added);
 next.history.push({type:'plan-drag-actual',planId,taskId:t.id,date,start,duration:p.duration,time:now.toISOString()});
 const target=next.tasks.find(x=>x.id===t.id);
 const all=next.plans.filter(x=>x.taskId===t.id);
 const finished=all.length&&all.every(x=>next.history.some(h=>h.type==='plan-drag-actual'&&h.planId===x.id)||activityCoversPlan(next,x));
 const childPending=next.tasks.some(x=>x.parentId===t.id&&!x.done),active=next.taskTimer?.taskId===t.id;
 let completed=false;
 if(finished&&!childPending&&!active&&!target.done){target.done=true;target.completedAt=now.toISOString();completed=true;if(next.currentTask===target.id)next.currentTask=null}
 const total=sumActivity(next.activity.filter(a=>a.taskId===t.id));
 if(total)target.actual=Math.max(Number.isFinite(target.actual)?target.actual:0,total);
 return {next,addedMinutes:sumActivity(added),completed,alreadyRecordedMinutes:p.duration-sumActivity(added)};
}

function completedPlanSlots(projectId,from,to){
 let slots=new Map();
 for(let p of db.plans){let t=task(p.taskId);if(!t||!t.done||t.projectId!==projectId||p.date<from||p.date>to)continue;
 for(let i=Math.floor(p.start/10);i<Math.ceil((p.start+p.duration)/10);i++){let overlap=Math.min((i+1)*10,p.start+p.duration)-Math.max(i*10,p.start);let key=p.date+':'+i;let prior=slots.get(key);if(overlap>0&&(!prior||prior.overlap<overlap))slots.set(key,{date:p.date,slot:i,taskId:p.taskId,overlap})}}

const STATS_VIEW_KEY=STORE+'-stats-period-view';
let statsView='month',statsDate=today();
function validStatsDate(d){return typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&d.slice(0,4)>='1900'&&d.slice(0,4)<='9998'&&!isNaN(dt(d))&&dateKey(dt(d))===d}
try{const remembered=JSON.parse(localStorage.getItem(STATS_VIEW_KEY)||'null');if(remembered&&['day','week','month','year'].includes(remembered.view)&&validStatsDate(remembered.date)){statsView=remembered.view;statsDate=remembered.date}}catch{}
function saveStatsSelection(){try{localStorage.setItem(STATS_VIEW_KEY,JSON.stringify({view:statsView,date:statsDate}))}catch{}}
function statsRange(v,d){
 if(v==='day')return {start:d,end:d};
 if(v==='week'){const start=weekStart(d);return {start,end:addDay(start,6)}}
 if(v==='month'){const x=dt(d);return {start:d.slice(0,7)+'-01',end:dateKey(new Date(x.getFullYear(),x.getMonth()+1,0,12))}}
 return {start:d.slice(0,4)+'-01-01',end:d.slice(0,4)+'-12-31'}
}
function statsShiftDate(v,d,n){
 if(v==='day'||v==='week')return addDay(d,n*(v==='day'?1:7));
 const x=dt(d),target=new Date(x.getFullYear()+(v==='year'?n:0),x.getMonth()+(v==='month'?n:0),1,12),last=new Date(target.getFullYear(),target.getMonth()+1,0,12).getDate();
 target.setDate(Math.min(x.getDate(),last));return dateKey(target)
}
function setStatsView(v){if(!['day','week','month','year'].includes(v))return;statsView=v;saveStatsSelection();renderStats()}
function setStatsDate(d){if(!validStatsDate(d))return toast('请选择有效统计日期');statsDate=d;saveStatsSelection();renderStats()}
function setStatsPeriodValue(value){if(statsView==='month')setStatsDate(value+'-01');else if(statsView==='year')setStatsDate(String(value)+'-01-01');else setStatsDate(value)}
function shiftStatsPeriod(n){setStatsDate(statsShiftDate(statsView,statsDate,n))}
function statsDrill(v,d){if(!['day','week','month','year'].includes(v)||!validStatsDate(d))return;statsView=v;statsDate=d;saveStatsSelection();renderStats()}
function statsData(base,v,d,current){
 const range=statsRange(v,d),records=base.activity.filter(a=>a.date>=range.start&&a.date<=range.end);
 const dates=new Set(records.map(a=>a.date)),taskIds=new Set(records.map(a=>a.taskId).filter(Boolean));
 const counts=Object.keys(zones).map(k=>({key:k,minutes:sumActivity(records.filter(a=>(Object.hasOwn(zones,a.state)?a.state:'unknown')===k))}));
 const planned=base.plans.filter(p=>p.date>=range.start&&p.date<=range.end&&p.date<=current).reduce((n,p)=>n+p.duration,0);
 const elapsedEnd=range.end<current?range.end:current;
 let elapsedDays=0;
 for(let x=range.start;x<=elapsedEnd;x=addDay(x,1))elapsedDays++;
 const buckets=[];
 if(v==='day'){for(let h=0;h<24;h++)buckets.push({label:pad(h)+':00',date:d,minutes:sumActivity(records.filter(a=>Math.floor(a.slot/6)===h))})}
 else if(v==='year'){for(let m=1;m<=12;m++){const prefix=d.slice(0,4)+'-'+pad(m);buckets.push({label:m+'月',date:prefix+'-01',minutes:sumActivity(records.filter(a=>a.date.startsWith(prefix)))})}}
 else{for(let x=range.start;x<=range.end;x=addDay(x,1))buckets.push({label:v==='week'?'周'+'日一二三四五六'[dt(x).getDay()]:String(dt(x).getDate()),date:x,minutes:sumActivity(records.filter(a=>a.date===x))})}
 const minutes=sumActivity(records),assigned=sumActivity(records.filter(a=>a.taskId)),estimatedMinutes=sumActivity(records.filter(a=>a.source==='retrospective-estimate'));
 return {...range,records,minutes,assigned,days:dates.size,elapsedDays,taskCount:taskIds.size,planned,counts,buckets,estimatedMinutes}
}
function statsTrendHTML(data){
 const max=Math.max(10,...data.buckets.map(b=>b.minutes)),v=statsView;
 return `<div class="sub"><div class="panelhead"><h3>${{day:'每小时工作时长',week:'每日工作时长',month:'每日工作时长',year:'每月工作时长'}[v]}</h3><small>${v==='year'?'点击月份查看月分析':v==='day'?'每格一小时':'点击日期查看日分析'}</small></div><div class="stats-chart-scroll"><div class="stats-chart" style="--stats-cols:${data.buckets.length}">${data.buckets.map(b=>`<${v==='day'?'div':'button'} class="stats-chart-item" ${v==='day'?'':`type="button" onclick="statsDrill('${v==='year'?'month':'day'}','${b.date}')"`} title="${esc(b.date)} ${v==='day'?b.label:''} · ${fmt(b.minutes)}"><span class="stats-chart-value">${b.minutes?b.minutes>=60?(b.minutes/60).toFixed(1).replace(/\\.0$/,'')+'h':b.minutes+'m':''}</span><span class="stats-chart-track"><i style="height:${b.minutes?Math.max(2,b.minutes/max*100):0}%"></i></span><small>${b.label}</small></${v==='day'?'div':'button'}>`).join('')}</div></div><small>按实际活动记录统计，普通活动块10分钟，自动补录精确到分钟；无记录不代表没有工作。</small></div>`
}
function statsCalendarHTML(data){
 if(statsView!=='week'&&statsView!=='month')return '';
 const start=data.start,end=data.end,first=statsView==='week'?start:weekStart(start),days=Array.from({length:statsView==='week'?7:42},(_,i)=>addDay(first,i));
 return `<div class="sub"><div class="panelhead"><h3>${statsView==='week'?'周':'月'}打卡 · ${start} 至 ${end}</h3><b>${fmt(data.minutes)}</b></div><div class="calendar">${Array.from('一二三四五六日').map(x=>`<small style="text-align:center">周${x}</small>`).join('')}${days.map(d=>{const inside=d>=start&&d<=end,rec=inside?data.records.filter(r=>r.date===d):[],n=sumActivity(rec);return `<button type="button" class="day stats-day ${d===statsDate?'selected':''}" ${inside?'':'disabled'} style="opacity:${inside?1:.4};background:${n?'#e9f2fb':'#f7f9fc'}" onclick="statsDrill('day','${d}')"><b>${dt(d).getDate()}</b><small>${n?fmt(n):'未记录'}</small><span class="bars">${Object.keys(zones).map(k=>`<i style="width:${n?sumActivity(rec.filter(r=>(Object.hasOwn(zones,r.state)?r.state:'unknown')===k))/n*100:0}%;background:${k==='unknown'?'#ccd4df':getColor(k)}"></i>`).join('')}</span></button>`}).join('')}</div></div>`
}
function statsCategoryHTML(data){
 const byTask=new Map();
 for(const a of data.records){if(!a.taskId)continue;byTask.set(a.taskId,(byTask.get(a.taskId)||0)+activityMinutes(a))}
 const groups=new Map();
 for(const [id,minutes] of byTask){const t=task(id),category=t?.category||'未分类任务';if(!groups.has(category))groups.set(category,[]);groups.get(category).push(minutes)}
 return [...groups].sort((a,b)=>b[1].reduce((s,n)=>s+n,0)-a[1].reduce((s,n)=>s+n,0)).map(([category,values])=>`<div class="goalrow"><span>${esc(category)}</span><span>${values.length} 项 · ${fmt(values.reduce((s,n)=>s+n,0))}</span></div>`).join('')||'<div class="empty">所选周期没有关联具体任务的实际记录。</div>'
}

function renderStats(){
 const v=statsView,d=statsDate,data=statsData(db,v,d,today()),labels={day:'日',week:'周',month:'月',year:'年'};
 const control=v==='year'?`<input type="number" min="1900" max="9998" step="1" aria-label="选择年份" value="${d.slice(0,4)}" onchange="setStatsPeriodValue(this.value)">`:v==='month'?`<input type="month" aria-label="选择月份" value="${d.slice(0,7)}" onchange="setStatsPeriodValue(this.value)">`:`<input type="date" aria-label="${v==='week'?'选择所查周内任意日期':'选择日期'}" value="${d}" onchange="setStatsPeriodValue(this.value)">`;
 $('stats').innerHTML=`<div class="panelhead"><h2>工作统计与打卡</h2><button onclick="statsRecordManual()">补录</button></div><div class="sub stats-period"><div class="headrow" style="justify-content:space-between"><div class="seg">${Object.entries(labels).map(([k,n])=>`<button type="button" class="${v===k?'active':''}" aria-pressed="${v===k}" onclick="setStatsView('${k}')">${n}分析</button>`).join('')}</div><div class="headrow stats-date-controls"><button class="small" title="上一${labels[v]}" onclick="shiftStatsPeriod(-1)">‹</button>${control}<button class="small" title="下一${labels[v]}" onclick="shiftStatsPeriod(1)">›</button><button class="small" onclick="setStatsDate(today())">本${v==='day'?'日':labels[v]}</button></div></div><h3 class="stats-range">${labels[v]}分析 · ${data.start===data.end?data.start:data.start+' 至 '+data.end}</h3><small>${v==='week'?'周一至周日；日期选择器可选择该周内任意一天。':'统计时间范围独立于工作台。'}${data.start>today()?' · 所选周期尚未开始。':''}</small></div><div class="metrics stats-metrics">${[['时间轴记录总时长',fmt(data.minutes)],['有记录天数',data.days+' 天'],['日均工作时长',fmt(data.elapsedDays?Math.round(data.minutes/data.elapsedDays):0)],['关联任务数',data.taskCount+' 项'],['已关联任务工时',fmt(data.assigned)],['待分配工时',fmt(data.minutes-data.assigned)]].map(([n,value])=>`<div class="metric"><small>${n}</small><strong>${value}</strong></div>`).join('')}</div>${data.estimatedMinutes?`<div class="notice">其中 ${fmt(data.estimatedMinutes)} 为回溯估算时间，非键鼠实测记录；其他历史数据也可能含手动补录。</div>`:''}${statsTrendHTML(data)}${statsCalendarHTML(data)}<div class="sub"><h3>所选周期四象限工作时长</h3>${data.counts.map(({key,minutes})=>`<div class="goalrow"><span style="min-width:70px">${zones[key].name}</span><div class="track" style="flex:1;margin:6px"><i style="width:${data.minutes?minutes/data.minutes*100:0}%;background:${key==='unknown'?'#ccd4df':getColor(key)}"></i></div><span>${fmt(minutes)}</span></div>`).join('')}</div><div class="sub"><h3>所选周期任务类别工时</h3>${statsCategoryHTML(data)}<small>仅累计所选周期内已关联任务的活动块，不使用任务全生命周期耗时。</small></div><div class="sub"><h3>同类任务历史耗时参考（全部历史）</h3>${[...new Set(db.tasks.map(t=>t.category).filter(Boolean))].map(c=>{let r=estimateFor(c);return `<div class="goalrow"><span>${esc(c)}</span><span>${r?`${r.n} 项 · 中位数 ${r.m}m`:'暂无完成记录'}</span></div>`}).join('')||'<div class="empty">创建任务时填写同类标签，即可积累耗时估算数据。</div>'}</div>`

function openSync(){modal('通过 ChatGPT 对话更新',`<p>导出当前数据并上传到我们的对话。说明要新增、调整、拆分或完成哪些任务，我可以根据现有记录生成更新后的 JSON 文件。你可以在这里导入，或粘贴 JSON 更新内容。</p><div class="notice">当前网页未连接 ChatGPT 实时接口。可将对话生成的增量 JSON 粘贴到下方应用，保留现有任务、计时和历史记录；首次新增任务无需导出空白数据。导入前会验证数据，替换全部数据时需要确认。</div><div class="headrow"><button class="primary" onclick="exportData()">导出当前数据</button><button onclick="$('importFile').click()">导入 JSON 文件</button></div>${field('或者粘贴更新 JSON',`<textarea id="jsonPaste" rows="8" placeholder='{"type":"patch","upsert":{"tasks":[...]}}'></textarea>`)}<div class="actions"><button onclick="copyTemplate()">复制更新指令模板</button><button class="primary" onclick="importText(val('jsonPaste'))">应用更新</button></div>`)}
function copyTemplate(){let text='请基于我上传的工作台数据 JSON 更新任务。保留原有 ID、工作历史、状态和主题；新增项目或任务使用唯一 ID；修改任务时保留未改字段。请返回完整 version=1 JSON 文件，或 type=patch 的增量 JSON（upsert 支持 projects、tasks、plans、activity，各项按 id 匹配，activity 按 date+slot 匹配；set 支持 state、currentTask、goals、theme）。保留 taskTimer 和任务的 timerMs 字段（秒级计时独立于10分钟工作统计）。不要虚构实际工作时间。';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('已复制')).catch(()=>prompt('复制指令',text));else prompt('复制指令',text)}
function validate(x){if(!x||x.version!==1)return '不支持的数据版本';for(let k of ['projects','tasks','plans','activity','notes','history'])if(!Array.isArray(x[k]))return k+' 必须为数组';const goodId=v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,120}$/.test(v);const unique=(a,k)=>new Set(a.map(k)).size===a.length;const isDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(dt(d));for(let k of ['projects','tasks','plans'])if(x[k].some(a=>!a||!goodId(a.id))||!unique(x[k],a=>a.id))return k+' 存在无效或重复 ID';for(let p of x.projects)if(typeof p.name!=='string'||(p.deadline&&!isDate(p.deadline)))return '项目无效';let ti=new Set(x.tasks.map(t=>t.id)),pi=new Set(x.projects.map(t=>t.id));for(let t of x.tasks){if(typeof t.name!=='string'||!Number.isInteger(t.estimate)||t.estimate<1||t.estimate>1440||(t.projectId&&!pi.has(t.projectId))||(t.parentId&&!ti.has(t.parentId))||(t.date&&!isDate(t.date)))return '任务无效';let seen=new Set([t.id]),p=t.parentId;while(p){if(seen.has(p))return '任务树存在循环';seen.add(p);let a=x.tasks.find(k=>k.id===p);if(a.projectId!==t.projectId)return '上级任务项目不一致';p=a.parentId}}for(let p of x.plans)if(!ti.has(p.taskId)||!isDate(p.date)||!Number.isInteger(p.start)||!Number.isInteger(p.duration)||p.start<0||p.duration<1||p.start+p.duration>1440)return '排程时间无效';if(x.activity.some(a=>!isDate(a.date)||!Number.isInteger(a.slot)||a.slot<0||a.slot>143||!Object.hasOwn(zones,a.state||'unknown')||(a.taskId&&!ti.has(a.taskId)))||x.activity.some(a=>!Number.isInteger(activityStart(a))||!Number.isInteger(activityEnd(a))||activityStart(a)<a.slot*10||activityEnd(a)>(a.slot+1)*10||activityStart(a)>=activityEnd(a)))return '活动记录无效';const activityOrder=[...x.activity].sort((a,b)=>a.date.localeCompare(b.date)||activityStart(a)-activityStart(b));if(activityOrder.some((a,i)=>i>0&&a.date===activityOrder[i-1].date&&activityStart(a)<activityEnd(activityOrder[i-1])))return '活动记录重叠';if(x.tasks.some(t=>t.timerMs!=null&&(!Number.isFinite(t.timerMs)||t.timerMs<0)))return '任务计时数据无效';if(x.workSession!=null&&!validWorkSession(x.workSession))return '独立工作计时数据无效';if(x.taskTimer!=null&&(!ti.has(x.taskTimer.taskId)||!Number.isFinite(x.taskTimer.startedAt)||x.taskTimer.startedAt<0))return '实时计时数据无效';if(x.state&&!Object.hasOwn(defaults,x.state)||x.currentTask&&!ti.has(x.currentTask))return '状态或当前任务无效';if(!x.widgets||Object.keys(defaults).some(k=>!Array.isArray(x.widgets[k])||x.widgets[k].some(w=>!Array.isArray(w)||typeof w[0]!=='string'||typeof w[1]!=='string')))return '组件配置无效';if(!x.theme||Object.keys(fresh().theme).some(k=>!/^#[0-9a-f]{6}$/i.test(x.theme[k])))return '主题配置无效';if(!x.goals||['low','normal','high'].some(k=>!Number.isFinite(x.goals[k])||x.goals[k]<0||x.goals[k]>1440))return '目标设置无效';return null}
function importText(s){let x;try{x=JSON.parse(s)}catch{return toast('JSON 格式无效，请检查文件')};let patch=x?.type==='patch',next;try{if(patch){next=clone(db);for(let k of ['projects','tasks','plans','activity'])for(let r of x.upsert?.[k]||[]){let key=a=>k==='activity'?a.date+':'+activityStart(a)+':'+activityEnd(a):a.id;let i=next[k].findIndex(a=>key(a)===key(r));if(i>=0)next[k][i]={...next[k][i],...r};else next[k].push(r)}for(let k of ['state','currentTask','goals','theme','demo'])if(Object.hasOwn(x.set||{},k))next[k]=['goals','theme'].includes(k)?{...next[k],...x.set[k]}:x.set[k]}else next=x;let err=validate(next);if(err)return toast('未导入：'+err)}catch(e){return toast('未导入：数据结构不正确')}if(!confirm(patch?'应用此增量更新？':'导入将替换全部本地数据，建议先备份。继续？'))return;if(patch&&next.taskTimer&&next.currentTask!==next.taskTimer.taskId){let old=next.tasks.find(t=>t.id===next.taskTimer.taskId);if(old)old.timerMs=elapsedTaskMs(old.id);next.taskTimer=null}db=next;lastSlot='';closeModal();render();toast('数据已更新')}
$('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(f)importText(await f.text());e.target.value=''});function toggleAI(force){if($('aiRoot').innerHTML&&!force){$('aiRoot').innerHTML='';return}$('aiRoot').innerHTML=`<section class="panel ai"><div class="panelhead"><h2>AI 助手 · 对话协作</h2><button onclick="$('aiRoot').innerHTML=''">✕</button></div><p class="muted">此原型尚未配置 API。使用当前 ChatGPT 对话拆解任务、修正排程或制定长期目标。</p><textarea id="aiAsk" rows="4" placeholder="例如：将论文修改拆成三天任务，安排保底与高能量目标"></textarea><div class="actions"><button onclick="exportData()">导出数据</button><button class="primary" onclick="copyAsk()">复制请求</button><button onclick="openSync()">导入回复</button></div></section>`}function copyAsk(){let s=val('aiAsk');if(!s.trim())return toast('请输入请求');let text='请根据我提供的工作台 JSON 数据更新规划并返回可导入的 JSON：'+s;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('已复制请求，请粘贴至对话')).catch(()=>prompt('复制请求',text));else prompt('复制请求',text)}
