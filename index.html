function modal(title,body){$('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="panelhead"><h2>${esc(title)}</h2><button class="small" onclick="closeModal()">✕</button></div>${body}</div></div>`}function closeModal(){$('modalRoot').innerHTML=''}function option(v,n,sel){return `<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(n)}</option>`}function taskOptions(sel,all=false){return option('','未指定',sel)+(all?db.tasks:activeTasks()).map(t=>option(t.id,t.name,sel)).join('')}function projectOptions(sel){return option('','独立任务',sel)+db.projects.map(p=>option(p.id,p.name,sel)).join('')}function field(label,html){return `<div class="field"><label>${label}</label>${html}</div>`}function input(id,v='',type='text',extra=''){return `<input id="${id}" type="${type}" value="${esc(v)}" ${extra}>`}function select(id,opts){return `<select id="${id}">${opts}</select>`}function actions(fn,extra=''){return `<div class="actions">${extra}<button onclick="closeModal()">取消</button><button class="primary" onclick="${fn}">确认保存</button></div>`}const val=id=>$(id).value;
function estimateFor(cat){if(!cat.trim())return null;let a=db.tasks.filter(t=>t.done&&t.category===cat&&Number(t.actual??actualFor(t.id))>0).map(t=>Number(t.actual??actualFor(t.id))).sort((a,b)=>a-b);return a.length?{n:a.length,m:Math.round((a[Math.floor((a.length-1)/2)]+a[Math.floor(a.length/2)])/2)}:null}
function editTask(id=null,pid=null,parent=null){let t=task(id)||{name:'',projectId:pid,parentId:parent,date:day,estimate:30,goal:'normal',category:'',priority:'',actual:null};let parOpts=option('','无上级任务',t.parentId)+db.tasks.filter(k=>k.id!==id&&k.projectId===t.projectId&&!descendant(k.id,id)).map(k=>option(k.id,k.name,t.parentId)).join('');modal(id?'编辑任务':'新建任务',field('任务名称',input('tn',t.name,'text','placeholder="可执行的具体行动"'))+field('所属项目',select('tp',projectOptions(t.projectId)))+field('上级任务',select('tpar',parOpts))+`<div class="formrow">${field('计划日期（可留空）',input('td',t.date,'date'))}${field('预计耗时（分钟）',input('te',t.estimate,'number','min="1" max="1440"'))}</div>`+field('同类任务标签（用于学习耗时）',input('tc',t.category,'text','oninput="suggestEstimate()" placeholder="例如：论文图表修改"'))+`<div id="estimateHint" class="muted"></div><div class="formrow">${field('每日目标',select('tg',[['low','保底'],['normal','进度'],['high','高能量']].map(([v,n])=>option(v,n,t.goal)).join('')))}${field('优先级（可选）',select('tprio',['','重要且紧急','重要但不紧急','紧急但不重要','不重要且不紧急'].map(v=>option(v,v||'未分类',t.priority)).join('')))}</div>`+(id&&(t.timerMs!=null||db.taskTimer?.taskId===id)?`<div class="notice">累计任务计时：${clockText(elapsedTaskMs(id))}（秒级计时，不计入10分钟工作统计）</div>`:'')+field('实际耗时（分钟，可修正）',input('ta',t.actual??(actualFor(id)||''),'number','min="0"'))+field('备注 / 最小行动',`<textarea id="tnote" rows="3">${esc(t.note||'')}</textarea>`)+actions(`saveTask(${id?"'"+safeId(id)+"'":'null'})`,id?`<button onclick="editTask(null,'${safeId(t.projectId||'')}','${safeId(id)}')">＋ 子任务</button><button class="danger" onclick="deleteTask('${safeId(id)}')">删除</button>`:''));$('tp').onchange=()=>{$('tpar').innerHTML=option('','无上级任务','')+db.tasks.filter(k=>k.id!==id&&String(k.projectId||'')===val('tp')&&!descendant(k.id,id)).map(k=>option(k.id,k.name,'')).join('')};suggestEstimate()}
function descendant(id,ancestor){if(!ancestor)return false;let seen=new Set();while(id&&!seen.has(id)){if(id===ancestor)return true;seen.add(id);id=task(id)?.parentId}return false}function suggestEstimate(){let r=estimateFor(val('tc'));$('estimateHint').innerHTML=r?`历史同类任务 ${r.n} 项，中位耗时 ${r.m} 分钟。 <button class="small" onclick="$('te').value=${r.m}">采用建议</button>`:'暂无该类型的历史耗时，暂使用手动估算。'}function saveTask(id){let name=val('tn').trim(),estimate=Number(val('te')),p=val('tp')||null,par=val('tpar')||null;if(!name||!Number.isInteger(estimate)||estimate<1||estimate>1440||descendant(par,id))return toast('请检查任务名称、时间和上级任务');let t=task(id)||{id:uid(),done:false};Object.assign(t,{name,projectId:p,parentId:par,date:val('td')||null,estimate,category:val('tc').trim(),goal:val('tg'),priority:val('tprio'),actual:val('ta')===''?null:Math.max(0,Number(val('ta'))),note:val('tnote')});if(!id)db.tasks.push(t);else if(p!==null||!p)for(let c of db.tasks.filter(k=>k.id!==id&&descendant(k.id,id)))c.projectId=p;closeModal();render()}
function deleteTask(id){if(!confirm('删除此任务及其子任务？工作记录保留为未分配。'))return;let ids=new Set(db.tasks.filter(t=>descendant(t.id,id)).map(t=>t.id));if(ids.has(db.taskTimer?.taskId))settleTaskTimer();db.tasks=db.tasks.filter(t=>!ids.has(t.id));db.plans=db.plans.filter(p=>!ids.has(p.taskId));for(let a of db.activity)if(ids.has(a.taskId))a.taskId=null;if(ids.has(db.currentTask))db.currentTask=null;closeModal();render()}
function editPlan(id=null,start=null,tid=null){let p=db.plans.find(x=>x.id===id)||{taskId:tid,start:start??540,duration:task(tid)?.estimate||30,date:day};modal(id?'编辑排程':'安排任务',field('任务',select('pt',taskOptions(p.taskId,true)))+field('日期',input('pd',p.date,'date'))+`<div class="formrow">${field('开始时间',input('ps',hm(p.start),'time'))}${field('时长（分钟）',input('pl',p.duration,'number','min="10" max="1440" step="10"'))}</div>`+actions(`savePlan(${id?"'"+safeId(id)+"'":'null'})`,id?`<button class="danger" onclick="deletePlan('${safeId(id)}')">移回待排程</button>`:''));$('pt').onchange=()=>{if(task(val('pt')))$('pl').value=task(val('pt')).estimate}}
function savePlan(id){let tid=val('pt'),d=val('pd'),start=min(val('ps')),duration=Number(val('pl'));if(!task(tid)||!d||!Number.isFinite(start)||!Number.isInteger(duration)||duration<1||start<0||start+duration>1440)return toast('请填写有效任务和当日时间范围');let p=db.plans.find(x=>x.id===id)||{id:uid()};if(db.plans.some(x=>x.id!==id&&x.date===d&&start<x.start+x.duration&&start+duration>x.start)){if(!confirm('该时段与已有计划重叠，仍然保存？'))return}Object.assign(p,{taskId:tid,date:d,start,duration});if(!id)db.plans.push(p);closeModal();render()}function deletePlan(id){db.plans=db.plans.filter(p=>p.id!==id);closeModal();render()}
function dragTask(e,id){e.dataTransfer.setData('text/plain',JSON.stringify({taskId:id}));e.dataTransfer.effectAllowed='copy'}function dragPlan(e,id){let p=db.plans.find(x=>x.id===id);e.dataTransfer.setData('text/plain',JSON.stringify({planId:id,offset:Math.max(0,Math.round((e.clientY-e.currentTarget.getBoundingClientRect().top)/SCALE))}));e.dataTransfer.effectAllowed='move'}function dropTask(e,node){e.preventDefault();node.classList.remove('dragover');let x;try{x=JSON.parse(e.dataTransfer.getData('text/plain'))}catch{return}let p=db.plans.find(a=>a.id===x.planId),t=task(x.taskId||p?.taskId);if(!t)return;let duration=p?.duration||t.estimate,start=Math.max(0,Math.min(1440-duration,Math.round(((e.clientY-node.getBoundingClientRect().top)/SCALE-(x.offset||0))/10)*10));if(!p){p={id:uid(),taskId:t.id,date:day,start,duration};db.plans.push(p)}else{p.date=day;p.start=start}render();toast('已排程 '+hm(start)+'，'+duration+' 分钟')}function blankPlan(e,node){if(e.target!==node)return;editPlan(null,Math.max(0,Math.min(1430,Math.floor((e.clientY-node.getBoundingClientRect().top)/SCALE/10)*10)))}function resizePlan(e,id){e.stopPropagation();e.preventDefault();let p=db.plans.find(x=>x.id===id),y=e.clientY,old=p.duration,b=e.currentTarget.parentElement;let move=ev=>{p.duration=Math.max(10,Math.min(1440-p.start,Math.round((old+(ev.clientY-y)/SCALE)/10)*10));b.style.height=p.duration*SCALE+'px'};let up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);render();toast('已调整为 '+p.duration+' 分钟')};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)}
function recordManual(){modal('补录工作活动',field('日期',input('ad',day,'date'))+`<div class="formrow">${field('开始时间',input('as','09:00','time'))}${field('结束时间',input('ae','10:00','time'))}</div>`+field('工作状态',select('az',Object.keys(zones).map(k=>option(k,zones[k].name,db.state||'unknown')).join('')))+field('关联任务（可留空）',select('at',taskOptions(db.currentTask,true)))+`<div class="notice">时间按固定10分钟块记录，向外取整。已存在的时间块将按本次信息覆盖，不重复累计。</div>`+actions('saveManual()'))}function putActivity(r){let a=db.activity.find(x=>x.date===r.date&&x.slot===r.slot);if(a)Object.assign(a,r);else db.activity.push(r)}function saveManual(){let d=val('ad'),a=min(val('as')),b=min(val('ae'));if(!d||!Number.isFinite(a)||!Number.isFinite(b)||a>=b)return toast('请填写有效时间，跨日请分开补录');for(let i=Math.floor(a/10);i<Math.ceil(b/10);i++)putActivity({date:d,slot:i,state:val('az'),taskId:val('at')||null,source:'manual'});closeModal();render()}
function assignActivity(d,a,b){let rec=db.activity.find(x=>x.date===d&&x.slot===a);modal('调整实际工作记录',`<p>${esc(d)} · ${hm(a*10)}–${hm(b*10)}</p>`+field('关联任务',select('assignT',taskOptions(rec?.taskId,true)))+field('状态',select('assignZ',Object.keys(zones).map(k=>option(k,zones[k].name,rec?.state||'unknown')).join('')))+actions(`saveAssignment('${d}',${a},${b})`,`<button class="danger" onclick="deleteActivity('${d}',${a},${b})">删除此记录</button>`))}function saveAssignment(d,a,b){for(let x of db.activity)if(x.date===d&&x.slot>=a&&x.slot<b){x.taskId=val('assignT')||null;x.state=val('assignZ')}closeModal();render()}function deleteActivity(d,a,b){if(!confirm('删除这段实际活动记录？'))return;db.activity=db.activity.filter(x=>!(x.date===d&&x.slot>=a&&x.slot<b));closeModal();render()}
function browserActivity(){if(!db.recordBrowser||document.visibilityState!=='visible')return;let n=new Date(),d=dateKey(n),slot=Math.floor((n.getHours()*60+n.getMinutes())/10),key=d+':'+slot;if(lastSlot===key)return;lastSlot=key;if(!db.activity.some(a=>a.date===d&&a.slot===slot)){db.activity.push({date:d,slot,state:db.state||'unknown',taskId:db.currentTask||null,source:'browser'});save();renderMetrics();renderFooter();if(page==='work'&&view==='day')renderCenter()}}for(let e of ['keydown','pointerdown','pointermove'])document.addEventListener(e,browserActivity,{passive:true});
function openWidget(i){let z=db.state,w=db.widgets[z]?.[i];if(!w)return;db.history.push({type:'widget',state:z,widget:w[0],time:new Date().toISOString()});save();let name=w[0];if(name.includes('倾倒')||name.includes('寄存')){modal(name,`<p class="muted">先把脑子里的内容放到这里，无需立刻处理。</p>${field('想法',`<textarea id="noteText" rows="7" placeholder="每行一个想法，或者自由书写"></textarea>`)}<div class="actions"><button onclick="closeModal()">取消</button><button onclick="saveNote(false)">寄存</button><button class="primary" onclick="saveNote(true)">保存并选择一件任务</button></div>`);return}if(name.includes('休息')){modal(name,`<p>不必强迫自己工作。按自己的节奏休息。</p><div style="font-size:36px;text-align:center;padding:20px" id="restTime">00:00</div><div class="actions"><button onclick="closeModal()">结束休息</button></div>`);let start=Date.now(),timer=setInterval(()=>{if(!$('restTime')){clearInterval(timer);return}let s=Math.floor((Date.now()-start)/1000);$('restTime').textContent=pad(Math.floor(s/60))+':'+pad(s%60)},1000);return}if(name.includes('最小行动')){modal(name,field('选择任务',select('wt',taskOptions(db.currentTask)))+field('先做哪一个最小动作？',`<textarea id="wa" rows="3" placeholder="例如：打开文件，读一句话，写一个标题"></textarea>`)+`<p class="muted">这是一条临时启动行动，不会自动创建正式任务。</p><div class="actions"><button onclick="openSync()">通过对话生成建议</button><button class="primary" onclick="if(val('wt'))db.currentTask=val('wt');db.notes.push({text:val('wa'),type:'micro',time:new Date().toISOString()});closeModal();startWork()">开始这个动作</button></div>`);return}if(name.includes('直接')||name.includes('沉浸')||name.includes('继续')){closeModal();startWork();return}let a=activeTasks();if(name.includes('随机')&&a.length)a=[a[Math.floor(Math.random()*a.length)]];else if(name.includes('快速')||name.includes('低负担'))a=[...a].sort((x,y)=>x.estimate-y.estimate).slice(0,5);else if(name.includes('核心'))a=[...a].sort((x,y)=>Number(y.priority==='重要且紧急')-Number(x.priority==='重要且紧急'));modal(name,`<p class="muted">${esc(w[1])}。由你决定从哪项任务开始。</p>${a.map(t=>`<div class="taskrow"><span class="name">${esc(t.name)}</span><small>${t.estimate}m</small><button class="small" onclick="db.currentTask='${safeId(t.id)}';closeModal();startWork()">开始</button></div>`).join('')||'<div class="empty">暂无可执行任务。可先创建一个任务。</div>'}<div class="actions"><button onclick="editTask()">新建任务</button><button onclick="closeModal()">关闭</button></div>`)}function saveNote(pick){let s=val('noteText').trim();if(s)db.notes.push({text:s,type:'idea',time:new Date().toISOString()});save();closeModal();if(pick){let i=db.widgets[db.state].findIndex(w=>w[0].includes('选择器'));if(i>=0)openWidget(i)}}function editWidgets(){if(!db.state)return toast('先选择一个象限');let s=db.state;modal('组件设置 · '+zones[s].name,`<p class="muted">每行一个组件，格式：名称 | 描述。顺序即显示顺序。</p><textarea id="widgetEdit" rows="9">${esc(db.widgets[s].map(x=>x.join(' | ')).join('\n'))}</textarea>`+actions(`saveWidgets('${s}')`,`<button onclick="$('widgetEdit').value=defaults['${s}'].map(x=>x.join(' | ')).join('\\n')">恢复默认</button>`))}
function saveWidgets(s){db.widgets[s]=val('widgetEdit').split('\n').filter(x=>x.trim()).map(x=>{let [n,...d]=x.split('|');return[n.trim(),d.join('|').trim()]});closeModal();render()}
function editProject(id){let p=project(id)||{name:'',deadline:'',priority:'',weeklyMin:0};modal(id?'编辑长期项目':'建立长期项目',field('项目名称',input('pn',p.name))+field('截止日期（可选）',input('pdue',p.deadline,'date'))+field('优先级（可选）',select('pp',['','重要且紧急','重要但不紧急','紧急但不重要','不重要且不紧急'].map(v=>option(v,v||'未分类',p.priority)).join('')))+field('每周最低投入（分钟，0为不限制）',input('pw',p.weeklyMin,'number','min="0"'))+actions(`saveProject(${id?"'"+safeId(id)+"'":'null'})`))}function saveProject(id){if(!val('pn').trim())return toast('请输入项目名称');let p=project(id)||{id:uid()};Object.assign(p,{name:val('pn').trim(),deadline:val('pdue'),priority:val('pp'),weeklyMin:Math.max(0,Number(val('pw'))||0)});if(!id)db.projects.push(p);closeModal();render()}
function renderPage(){for(let p of ['work','projects','stats','settings']){if(p==='work')$(p).style.display=page===p?'grid':'none';else $(p).classList.toggle('show',page===p)}document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='projects')renderProjects();if(page==='stats')renderStats();if(page==='settings')renderSettings()}
function renderProjects(){$('projects').innerHTML=`<div class="panelhead"><h2>长期任务追踪</h2><button class="primary" onclick="editProject()">＋ 新建项目</button></div><div class="notice">此版本可手动维护目标、优先级与任务。跨项目智能重规划通过对话更新，暂未连接外部 AI API。</div>${db.projects.map(p=>{let a=progress(p),remaining=db.tasks.filter(t=>t.projectId===p.id&&!t.done&&!db.tasks.some(c=>c.parentId===t.id)).reduce((s,t)=>s+t.estimate,0),days=p.deadline?Math.max(0,Math.round((dt(p.deadline)-dt(today()))/864e5)+1):null;return `<div class="projectcard"><header><b>${esc(p.name)}</b><div><button class="small" onclick="editProject('${safeId(p.id)}')">编辑</button> <button class="small" onclick="editTask(null,'${safeId(p.id)}')">＋ 任务</button></div></header><p class="muted">截止：${esc(p.deadline||'未设置')} · ${esc(p.priority||'未分类')} · 每周保护 ${p.weeklyMin||0} 分钟</p><div class="track" style="margin:10px 0"><i style="width:${a.n?a.k/a.n*100:0}%"></i></div><div class="headrow"><span>${a.k}/${a.n} 项完成</span><span class="muted">预计剩余 ${fmt(remaining)}</span>${days!==null?`<span class="muted">剩余 ${days} 天 · 均需 ${days?Math.ceil(remaining/days):remaining}m/天</span>`:''}${days===0&&remaining?'<span class="danger">已逾期</span>':''}</div></div>`}).join('')||'<div class="empty">暂无长期项目</div>'}<button onclick="openSync()">通过对话制定或调整长期规划</button>`}
function renderStats(){let d=today(),w=weekStart(d),m=d.slice(0,7)+'-01',rec=db.activity.filter(a=>a.date>=m&&a.date<=d),total=rec.length,counts=Object.keys(zones).map(s=>[s,rec.filter(a=>(a.state||'unknown')===s).length]);$('stats').innerHTML=`<div class="panelhead"><h2>工作统计与打卡</h2><button onclick="recordManual()">补录</button></div><div class="metrics" style="grid-template-columns:repeat(3,1fr)">${[['今日',dayMins(d)],['本周',rangeMins(w,addDay(w,6))],['本月',rangeMins(m,d)]].map(([n,v])=>`<div class="metric"><small>${n}</small><strong>${fmt(v)}</strong></div>`).join('')}</div>${calendarHTML('month',day)}<div class="sub"><h3>本月四象限工作时长</h3>${counts.map(([s,n])=>`<div class="goalrow"><span style="min-width:70px">${zones[s].name}</span><div class="track" style="flex:1;margin:6px"><i style="width:${total?n/total*100:0}%;background:${s==='unknown'?'#ccd4df':getColor(s)}"></i></div><span>${fmt(n*10)}</span></div>`).join('')}</div><div class="sub"><h3>同类任务实际耗时</h3>${[...new Set(db.tasks.map(t=>t.category).filter(Boolean))].map(c=>{let r=estimateFor(c);return `<div class="goalrow"><span>${esc(c)}</span><span>${r?`${r.n} 项 · 中位数 ${r.m}m`:'暂无完成记录'}</span></div>`}).join('')||'<div class="empty">创建任务时填写同类标签，即可积累耗时估算数据。</div>'}</div>`}
function renderSettings(){$('settings').innerHTML=`<div class="panelhead"><h2>设置</h2><button onclick="openSync()">备份与恢复</button></div><div class="sub"><h3>主题配色</h3><div class="headrow sectiongap">${Object.entries(db.theme).map(([k,v])=>`<label>${({bg:'背景',accent:'强调色',focus:'投入',noise:'降噪',activate:'激活',repair:'修复'})[k]} <input type="color" class="theme-swatch" value="${v}" oninput="db.theme['${k}']=this.value;applyTheme();save()"></label>`).join('')}<button onclick="db.theme=fresh().theme;render()">恢复默认</button></div></div><div class="sub"><h3>每日工作量预算</h3><div class="formrow sectiongap">${['low','normal','high'].map((k,i)=>field(['保底（分钟）','进度（分钟）','高能量（分钟）'][i],`<input type="number" min="0" max="1440" value="${db.goals[k]}" onchange="db.goals['${k}']=Math.max(0,Math.min(1440,Number(this.value)||0));renderMetrics();save()">`)).join('')}</div></div><div class="sub"><h3>活动监测</h3><label><input type="checkbox" ${db.recordBrowser?'checked':''} onchange="db.recordBrowser=this.checked;lastSlot='';save()"> 启用本网页内鼠标键盘活动记录（测试）</label><div class="notice">当前为单文件网页原型，不具备跨软件监测、开机自启或系统托盘权限。全电脑正式计时需要 Windows 本地程序。网页活动记录默认关闭。</div></div><div class="sub"><h3>数据与隐私</h3><p class="muted">数据保存在当前浏览器本地存储，不会自动上传。建议定期导出 JSON 备份。</p><div class="headrow sectiongap"><button onclick="exportData()">导出 JSON</button><button onclick="$('importFile').click()">导入数据</button><button class="danger" onclick="resetData(false)">清除示例 / 开始使用</button><button onclick="resetData(true)">恢复演示</button></div></div><div class="sub"><h3>寄存的想法与临时行动</h3>${db.notes.map((n,i)=>`<div class="taskrow"><span class="name" style="white-space:pre-wrap">${esc(n.text)}</span><button class="small" onclick="db.notes.splice(${i},1);render()">删除</button></div>`).join('')||'<div class="empty">暂无寄存内容</div>'}</div>`}
function resetData(demo){if(!confirm('这会替换当前本地数据，请先导出备份。继续？'))return;db=fresh(demo);lastSlot='';day=today();render();toast(demo?'已恢复示例':'已建立空白工作台')}
function exportData(){let url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download=(STORE==='start-workbench-sync-test-v04'?'虚拟V04工作台数据_':'工作台数据_')+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function openSync(){modal('通过 ChatGPT 对话更新',`<p>导出当前数据并上传到我们的对话。说明要新增、调整、拆分或完成哪些任务，我可以根据现有记录生成更新后的 JSON 文件。你可以在这里导入，或粘贴 JSON 更新内容。</p><div class="notice">当前网页未连接 ChatGPT 实时接口。可将对话生成的增量 JSON 粘贴到下方应用，保留现有任务、计时和历史记录；首次新增任务无需导出空白数据。导入前会验证数据，替换全部数据时需要确认。</div><div class="headrow"><button class="primary" onclick="exportData()">导出当前数据</button><button onclick="$('importFile').click()">导入 JSON 文件</button></div>${field('或者粘贴更新 JSON',`<textarea id="jsonPaste" rows="8" placeholder='{"type":"patch","upsert":{"tasks":[...]}}'></textarea>`)}<div class="actions"><button onclick="copyTemplate()">复制更新指令模板</button><button class="primary" onclick="importText(val('jsonPaste'))">应用更新</button></div>`)}
function copyTemplate(){let text='请基于我上传的工作台数据 JSON 更新任务。保留原有 ID、工作历史、状态和主题；新增项目或任务使用唯一 ID；修改任务时保留未改字段。请返回完整 version=1 JSON 文件，或 type=patch 的增量 JSON（upsert 支持 projects、tasks、plans、activity，各项按 id 匹配，activity 按 date+slot 匹配；set 支持 state、currentTask、goals、theme）。保留 taskTimer 和任务的 timerMs 字段（秒级计时独立于10分钟工作统计）。不要虚构实际工作时间。';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('已复制')).catch(()=>prompt('复制指令',text));else prompt('复制指令',text)}
function validate(x){if(!x||x.version!==1)return '不支持的数据版本';for(let k of ['projects','tasks','plans','activity','notes','history'])if(!Array.isArray(x[k]))return k+' 必须为数组';const goodId=v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,120}$/.test(v);const unique=(a,k)=>new Set(a.map(k)).size===a.length;const isDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(dt(d));for(let k of ['projects','tasks','plans'])if(x[k].some(a=>!a||!goodId(a.id))||!unique(x[k],a=>a.id))return k+' 存在无效或重复 ID';for(let p of x.projects)if(typeof p.name!=='string'||(p.deadline&&!isDate(p.deadline)))return '项目无效';let ti=new Set(x.tasks.map(t=>t.id)),pi=new Set(x.projects.map(t=>t.id));for(let t of x.tasks){if(typeof t.name!=='string'||!Number.isInteger(t.estimate)||t.estimate<1||t.estimate>1440||(t.projectId&&!pi.has(t.projectId))||(t.parentId&&!ti.has(t.parentId))||(t.date&&!isDate(t.date)))return '任务无效';let seen=new Set([t.id]),p=t.parentId;while(p){if(seen.has(p))return '任务树存在循环';seen.add(p);let a=x.tasks.find(k=>k.id===p);if(a.projectId!==t.projectId)return '上级任务项目不一致';p=a.parentId}}for(let p of x.plans)if(!ti.has(p.taskId)||!isDate(p.date)||!Number.isInteger(p.start)||!Number.isInteger(p.duration)||p.start<0||p.duration<1||p.start+p.duration>1440)return '排程时间无效';if(x.activity.some(a=>!isDate(a.date)||!Number.isInteger(a.slot)||a.slot<0||a.slot>143||!Object.hasOwn(zones,a.state||'unknown')||(a.taskId&&!ti.has(a.taskId)))||!unique(x.activity,a=>a.date+':'+a.slot))return '活动记录无效或重复';if(x.tasks.some(t=>t.timerMs!=null&&(!Number.isFinite(t.timerMs)||t.timerMs<0)))return '任务计时数据无效';if(x.taskTimer!=null&&(!ti.has(x.taskTimer.taskId)||!Number.isFinite(x.taskTimer.startedAt)||x.taskTimer.startedAt<0))return '实时计时数据无效';if(x.state&&!Object.hasOwn(defaults,x.state)||x.currentTask&&!ti.has(x.currentTask))return '状态或当前任务无效';if(!x.widgets||Object.keys(defaults).some(k=>!Array.isArray(x.widgets[k])||x.widgets[k].some(w=>!Array.isArray(w)||typeof w[0]!=='string'||typeof w[1]!=='string')))return '组件配置无效';if(!x.theme||Object.keys(fresh().theme).some(k=>!/^#[0-9a-f]{6}$/i.test(x.theme[k])))return '主题配置无效';if(!x.goals||['low','normal','high'].some(k=>!Number.isFinite(x.goals[k])||x.goals[k]<0||x.goals[k]>1440))return '目标设置无效';return null}
function importText(s){let x;try{x=JSON.parse(s)}catch{return toast('JSON 格式无效，请检查文件')};let patch=x?.type==='patch',next;try{if(patch){next=clone(db);for(let k of ['projects','tasks','plans','activity'])for(let r of x.upsert?.[k]||[]){let key=a=>k==='activity'?a.date+':'+a.slot:a.id;let i=next[k].findIndex(a=>key(a)===key(r));if(i>=0)next[k][i]={...next[k][i],...r};else next[k].push(r)}for(let k of ['state','currentTask','goals','theme','demo'])if(Object.hasOwn(x.set||{},k))next[k]=['goals','theme'].includes(k)?{...next[k],...x.set[k]}:x.set[k]}else next=x;let err=validate(next);if(err)return toast('未导入：'+err)}catch(e){return toast('未导入：数据结构不正确')}if(!confirm(patch?'应用此增量更新？':'导入将替换全部本地数据，建议先备份。继续？'))return;if(patch&&next.taskTimer&&next.currentTask!==next.taskTimer.taskId){let old=next.tasks.find(t=>t.id===next.taskTimer.taskId);if(old)old.timerMs=elapsedTaskMs(old.id);next.taskTimer=null}db=next;lastSlot='';closeModal();render();toast('数据已更新')}
$('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(f)importText(await f.text());e.target.value=''});function toggleAI(force){if($('aiRoot').innerHTML&&!force){$('aiRoot').innerHTML='';return}$('aiRoot').innerHTML=`<section class="panel ai"><div class="panelhead"><h2>AI 助手 · 对话协作</h2><button onclick="$('aiRoot').innerHTML=''">✕</button></div><p class="muted">此原型尚未配置 API。使用当前 ChatGPT 对话拆解任务、修正排程或制定长期目标。</p><textarea id="aiAsk" rows="4" placeholder="例如：将论文修改拆成三天任务，安排保底与高能量目标"></textarea><div class="actions"><button onclick="exportData()">导出数据</button><button class="primary" onclick="copyAsk()">复制请求</button><button onclick="openSync()">导入回复</button></div></section>`}function copyAsk(){let s=val('aiAsk');if(!s.trim())return toast('请输入请求');let text='请根据我提供的工作台 JSON 数据更新规划并返回可导入的 JSON：'+s;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('已复制请求，请粘贴至对话')).catch(()=>prompt('复制请求',text));else prompt('复制请求',text)}
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;renderPage()});window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('aiRoot').innerHTML=''}});render();setInterval(tickTaskTimer,250);document.addEventListener('visibilitychange',tickTaskTimer);
</script><script src="sync.js"></script><script src="preparation.js"></script></body></html>
